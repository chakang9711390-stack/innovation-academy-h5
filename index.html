<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>创新学院 H5 直播课堂</title>
    <link rel="stylesheet" href="./styles.css?v=20260513-admin6" />
  </head>
  <body>
    <section class="auth-screen" id="authScreen">
      <div class="auth-card">
        <div class="auth-brand">
          <p class="eyebrow">H5 直播课堂</p>
          <h1>创新学院</h1>
          <span class="pill">账号密码登录</span>
        </div>
        <div class="subtabs auth-tabs" role="tablist" aria-label="账号">
          <button class="subtab is-active" type="button" data-auth-mode="login">登录</button>
          <button class="subtab" type="button" data-auth-mode="register">注册</button>
        </div>
        <form class="auth-form" id="authForm">
          <label>账号<input id="authUsername" autocomplete="username" required placeholder="请输入账号" /></label>
          <label>密码<input id="authPassword" type="password" autocomplete="current-password" required placeholder="请输入密码" /></label>
          <label class="auth-register-field">确认密码<input id="authConfirmPassword" type="password" autocomplete="new-password" placeholder="请再次输入密码" /></label>
          <button class="primary-button full" type="submit" id="authSubmit">登录</button>
        </form>
        <p class="auth-tip" id="authTip">管理员初始账号：kete2026，密码：999999</p>
      </div>
    </section>

    <main class="app-shell">
      <header class="topbar">
        <div>
          <p class="eyebrow">21:00</p>
          <h1>创新学院</h1>
        </div>
        <div class="header-actions">
          <button class="reminder-badge" id="reminderBadge" type="button" aria-label="消息通知"><span></span><b>0</b></button>
          <span class="user-badge" id="userBadge">未登录</span>
          <button class="role-switch" id="logoutButton" type="button">退出</button>
          <span class="pill">学院直播</span>
        </div>
      </header>

      <nav class="tabs" id="mainTabs" aria-label="主导航"></nav>

      <section class="view is-active" id="calendarView" aria-labelledby="tab-calendar">
        <div class="calendar-panel">
          <div class="monthbar">
            <button class="icon-button" id="prevMonth" type="button" aria-label="上个月">‹</button>
            <h2 id="monthTitle">2026年4月</h2>
            <button class="icon-button" id="nextMonth" type="button" aria-label="下个月">›</button>
          </div>
          <div class="weekday-row">
            <span>日</span><span>一</span><span>二</span><span>三</span><span>四</span><span>五</span><span>六</span>
          </div>
          <div class="calendar-grid" id="calendarGrid"></div>
        </div>
        <div class="section-title">
          <h3 id="calendarListTitle">本月直播安排</h3>
          <button class="ghost-button" id="clearDay" type="button">查看全月</button>
        </div>
        <div class="calendar-filters" id="calendarFilters" aria-label="预约筛选">
          <button class="filter-chip is-active" type="button" data-calendar-filter="all">全部</button>
          <button class="filter-chip" type="button" data-calendar-filter="reserved">已预约</button>
          <button class="filter-chip" type="button" data-calendar-filter="unreserved">未预约</button>
        </div>
        <div class="event-list" id="eventList"></div>
      </section>

      <section class="view" id="squareView" aria-labelledby="tab-square">
        <div id="squareListPanel">
          <div class="square-filter" id="squarePositionFilter" aria-label="岗位筛选"></div>
          <div class="section-title">
            <h3>课程回放</h3>
            <span id="upcomingCount"></span>
          </div>
          <div class="course-list replay-grid" id="upcomingCourses"></div>
        </div>
        <div class="course-detail-page" id="courseDetailPage" hidden>
          <button class="detail-back" id="backToSquare" type="button">← 返回课程广场</button>
          <div id="courseDetailContent"></div>
        </div>
      </section>

      <section class="view" id="recordsView" aria-labelledby="tab-records">
        <div id="learningListPanel">
          <div class="learning-tabs" role="tablist" aria-label="学习记录">
            <button class="learning-tab is-active" type="button" data-record-mode="reservations">我的预约</button>
            <button class="learning-tab" type="button" data-record-mode="learning">我的学习</button>
          </div>
          <div id="learningStats" class="stats-grid" hidden>
            <article class="stat-card">
              <strong id="learnedCount">0</strong>
              <span>已学课程</span>
            </article>
            <article class="stat-card">
              <strong id="learnedHours">0h</strong>
              <span>累计时长</span>
            </article>
          </div>
          <div class="record-list learning-card-grid" id="reservationList"></div>
          <div class="record-list learning-card-grid" id="recordList" hidden></div>
        </div>
        <div class="rating-page" id="ratingPage" hidden>
          <button class="detail-back" id="backToLearning" type="button">← 返回学习记录</button>
          <div id="ratingPageContent"></div>
        </div>
      </section>

      <section class="view" id="manageView" aria-labelledby="tab-manage">
        <div class="admin-list-panel" id="adminListPanel">
          <div class="admin-page-head">
            <h3>课程管理 <span id="publishedManageCount"></span></h3>
          <button class="admin-publish-button" id="openPublishCourse" type="button">+ 发布课程</button>
          </div>
          <div class="admin-course-list" id="adminCourseList"></div>
        </div>

        <form class="manage-panel admin-editor-panel publish-course-form" id="courseFormPanel" hidden>
          <button class="detail-back" type="button" data-admin-back>← 返回管理</button>
          <h3 id="courseEditorTitle">发布新课程</h3>
          <input id="editingCourseId" type="hidden" />
          <div class="cover-editor">
            <span>课程封面图片</span>
            <div class="cover-preview" id="coverPreview"><span>暂无封面图</span></div>
            <label class="cover-drop">
              <input id="publishCoverFile" type="file" accept="image/png,image/jpeg,image/webp,image/*" />
              <span>点击上传封面图片</span>
              <small>支持 JPG、PNG，建议尺寸 1280×720，大小 ≤ 5MB</small>
            </label>
            <input id="coverUrl" type="hidden" />
          </div>
          <label>课程标题<input id="courseTitle" maxlength="60" required placeholder="如：AI培训课堂第7期" value="Kubernetes 日志定位与告警实战" /></label>
          <label>课程期数副标题<input id="courseSubtitle" maxlength="40" required placeholder="如：在线安装与实操" value="带领大家完成告警链路排查" /></label>
          <div class="two-col">
            <label>开课日期<input id="startDate" type="date" required value="2026-05-18" /></label>
            <label>时间段<input id="timeSlot" inputmode="numeric" required placeholder="21:00-22:00" value="20:00-21:30" /></label>
          </div>
          <input id="startAt" type="hidden" value="2026-05-18T20:00" />
          <input id="endAt" type="hidden" value="2026-05-18T21:30" />
          <label>课程内容简介<textarea id="contentLines" rows="4" placeholder="课程内容描述...">告警指标定位与日志链路串联
通过实操建立排障 SOP
常见误报与降噪策略</textarea></label>
          <div class="field-group">
            <span>适用岗位</span>
            <div class="position-picker">
              <div class="check-row" id="positionChecks"></div>
              <div class="more-position-wrap">
                <button class="more-positions" id="toggleMorePositions" type="button" aria-expanded="false">更多岗位</button>
                <div class="more-position-menu" id="morePositionChecks" hidden></div>
              </div>
            </div>
          </div>
          <label>Lark 会议链接（选填）<input id="liveUrl" type="url" placeholder="https://meeting.larksuite.com/..." value="https://example.com/live/k8s-log" /></label>
          <label>授课老师<input id="teacherName" required placeholder="如：深圳分公司团队 · Ben" value="创新学院-Rae" /></label>
          <label>适用场景（每行一条）<textarea id="scenarioLines" rows="4" placeholder="每行一条">告警频繁但定位慢
多团队协作排障
线上变更后快速回滚判断</textarea></label>
          <div class="form-actions">
            <button class="secondary-button" type="button" id="saveDraft">取消</button>
            <button class="secondary-button" type="button" id="cancelEdit">取消编辑</button>
            <button class="primary-button" type="submit" id="publishButton">发布</button>
          </div>
        </form>

        <form class="manage-panel admin-editor-panel" id="assetFormPanel" hidden>
          <button class="detail-back" type="button" data-admin-back>← 返回管理</button>
          <h3>上传回放视频和说明书</h3>
          <label>选择课程<select id="assetCourse"></select></label>
          <label>课程封面图片<input id="coverFile" type="file" accept="image/png,image/jpeg,image/webp,image/gif,image/*" /></label>
          <label>回放视频文件<input id="replayFile" type="file" accept="video/mp4,video/webm,video/ogg,video/quicktime,video/*" /></label>
          <label>知识手册 PDF<input id="handbookFile" type="file" accept="application/pdf" /></label>
          <p class="form-hint">文件将直传对象存储，数据库仅保存文件地址与元信息。</p>
          <div class="upload-progress" id="uploadProgress" aria-live="polite">
            <div class="upload-progress-head">
              <span id="uploadProgressText">上传进度 0%</span>
            </div>
            <div class="upload-progress-track"><span id="uploadProgressBar"></span></div>
          </div>
          <div class="asset-status" id="assetStatus"></div>
          <button class="primary-button full" type="submit">保存</button>
        </form>

        <section class="manage-panel admin-editor-panel" id="adminReviewPanel" hidden>
          <button class="detail-back" type="button" data-admin-back>← 返回管理</button>
          <h3>评价详情</h3>
          <div id="adminReviewContent"></div>
        </section>
      </section>
    </main>

    <div class="message-drawer" id="messageDrawer" aria-hidden="true">
      <div class="message-scrim" data-close-messages></div>
      <aside class="message-panel" aria-label="消息通知">
        <div class="message-head">
          <h3>消息通知</h3>
          <button class="message-read-all" id="readAllMessages" type="button">全部已读</button>
          <button class="message-close" type="button" data-close-messages>×</button>
        </div>
        <div class="message-list" id="messageList"></div>
      </aside>
    </div>

    <div class="confirm-modal" id="deleteConfirmModal" aria-hidden="true">
      <div class="confirm-dialog" role="dialog" aria-modal="true" aria-labelledby="deleteConfirmTitle">
        <p class="eyebrow">删除课程</p>
        <h3 id="deleteConfirmTitle">确认删除课程？</h3>
        <p id="deleteConfirmText">删除后学员端将不再展示该课程。</p>
        <div class="confirm-actions">
          <button class="secondary-button" type="button" id="cancelDeleteCourse">取消</button>
          <button class="danger-button" type="button" id="confirmDeleteCourse">删除</button>
        </div>
      </div>
    </div>

    <div class="rating-sheet" id="ratingSheet" aria-hidden="true">
      <div class="rating-sheet-panel" role="dialog" aria-modal="true" aria-labelledby="ratingSheetTitle">
        <div class="rating-sheet-head">
          <div>
            <p class="eyebrow">课程评价</p>
            <h3 id="ratingSheetTitle">AI培训课堂第4期 · 评分表</h3>
          </div>
          <button class="icon-button" id="closeRatingSheet" type="button" aria-label="关闭">×</button>
        </div>
        <p class="rating-course" id="ratingCourseIntro"></p>
        <form id="ratingForm" class="rating-form">
          <input id="ratingCourseId" type="hidden" />
          <label>
            <span>对 AI 直播课堂的整体打分</span>
            <span class="rating-stars" data-rating-field="ratingOverall"></span>
            <input id="ratingOverall" type="hidden" required />
          </label>
          <label>
            <span>老师讲解是否清晰完整，并对工作有帮助</span>
            <span class="rating-stars" data-rating-field="ratingClarity"></span>
            <input id="ratingClarity" type="hidden" />
          </label>
          <label>
            <span>本次课程内容难度</span>
            <select id="ratingDifficulty">
              <option value="适中">适中</option>
              <option value="偏简单">偏简单</option>
              <option value="偏困难">偏困难</option>
            </select>
          </label>
          <label>
            <span>是否完成安装和基础配置</span>
            <select id="ratingCompleted">
              <option value="是">是</option>
              <option value="否">否</option>
            </select>
          </label>
          <label>
            <span id="ratingTeacherLabel">对主讲老师的综合评价</span>
            <span class="rating-stars" data-rating-field="ratingTeacher"></span>
            <input id="ratingTeacher" type="hidden" />
          </label>
          <label>
            <span>你希望下次课程改进或新增哪些内容？（选填）</span>
            <textarea id="ratingComment" rows="3" placeholder="可以写下希望补充的案例、节奏或资料"></textarea>
          </label>
          <button class="primary-button full" type="submit">提交评价</button>
        </form>
      </div>
    </div>

    <div class="toast" id="toast" role="status" aria-live="polite"></div>
    <script src="./app.js?v=20260513-admin6"></script>
  </body>
</html>
